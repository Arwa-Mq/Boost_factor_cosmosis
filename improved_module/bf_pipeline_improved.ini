[runtime]
sampler = emcee
root = ${COSMOSIS_SRC_DIR}
fatal_errors = T
verbosity = debug

[output]
filename = outputs/bf_y1_all_bins_chain.txt
format = text
verbosity = debug

[emcee]
walkers = 20
samples = 5000
cpus = 4
save_covariance = T

[pipeline]
modules = boost_factor_likelihood
values = bf_values_all_bins.ini
likelihoods = boost_factor_likelihood

[likelihoods]
boost_factor_likelihood = boost_factor_likelihood

[boost_factor_likelihood]
file = bf_likelihood_improved.py
; Path to Y1 boost factor data (adjust to your system)
data_path = /global/cfs/cdirs/des/jesteves/data/boost_factor/y1/profiles
richness_bins = all
redshift_bins = all
n_radial_points = 8
