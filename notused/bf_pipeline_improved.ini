[runtime]
sampler = emcee
root = ${COSMOSIS_SRC_DIR}
fatal_errors = T
verbosity = debug

[output]
filename = outputs/bf_all_bins_chain.txt
format = text
verbosity = debug

[emcee]
walkers = 20
samples = 5000
cpus = 4
save_covariance = T

[pipeline]
modules = boost_factor_likelihood
values = bf_values_all_bins.ini
likelihoods = boost_factor_likelihood

[likelihoods]
boost_factor_likelihood = boost_factor_likelihood

[boost_factor_likelihood]
file = bf_likelihood_improved.py
data_path = data/y3_data/fcl_posteriors_zl_subsample
data_type = y3
richness_bins = all
redshift_bins = all
n_radial_points = 13
